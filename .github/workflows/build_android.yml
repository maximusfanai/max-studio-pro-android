name: Build Play Store AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android Platform Files & Custom Icon
        run: |
          flutter create --platforms=android --org com.maxstudiopro --project-name max_studio_pro .
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/android:label="max_studio_pro"/android:label="MAX Studio Pro"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          if [ -f "theme.png" ]; then
            flutter pub add --dev flutter_launcher_icons
            printf "flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: \"theme.png\"\n  adaptive_icon_background: \"#050510\"\n  adaptive_icon_foreground: \"theme.png\"\n" > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          fi

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Play Store App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Studio-Pro-PlayStore-Files
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
